# Sync to the lab gateway like the other control hosts; never fall back to ntp.ucla.edu (it answered ~2 h wrong).
# Poll at most every 64 s (the pegasus hosts use 64 s too): with the default 34 min cap, the board sat 21 ms
# behind 10.0.0.1 for 27 min after boot (2026-11-05), against the aggregator's 50 ms guard.
[Time]
NTP=10.0.0.1
FallbackNTP=
PollIntervalMaxSec=64
